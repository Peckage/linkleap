name: Release

# Push a tag like v0.2.0 (matching package.json) to build, test and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm run test:unit
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '/^## /{ if (p) exit; if ($2 == ver) { p = 1; next } } p' CHANGELOG.md > notes.md
          # Re-running a release job replaces the .vsix instead of failing on the existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" linkleap-*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" linkleap-*.vsix --title "LinkLeap $GITHUB_REF_NAME" --notes-file notes.md
          fi

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath linkleap-*.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish linkleap-*.vsix

      - name: Note skipped registries
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: |
          [ -n "$VSCE_PAT" ] || echo "::notice::VSCE_PAT secret not set, so the VS Code Marketplace publish was skipped."
          [ -n "$OVSX_PAT" ] || echo "::notice::OVSX_PAT secret not set, so the Open VSX publish was skipped."
